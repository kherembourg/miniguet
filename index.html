<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miniguet</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#0f1115">
<style>
:root{--bg:#0f1115;--card:#181b22;--sel:#262b38;--fg:#e8eaf0;--dim:#9aa1b4;--wait:#f5a524;--waitt:#f5a524;--work:#4c8dff;--workt:#7aa7ff;--idle:#4b5163;--new:#ff4d4d;--line:#232834}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--card:#fff;--sel:#e4e8f1;--fg:#14161b;--dim:#5d6477;--waitt:#a35f00;--workt:#2f63c9;--idle:#b7bccb;--line:#dde1ea}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:16px;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line);flex-shrink:0}
h1{font-size:20px;font-weight:600;margin:0;flex:1}
.count{font-size:37px;font-weight:700;line-height:1;color:var(--waitt)}
button{font:inherit;color:inherit}
#links a{color:var(--workt);margin-right:12px;font-size:13px}
#frame{position:fixed;inset:0;z-index:50;background:var(--bg)}#frame[hidden]{display:none}
#frame iframe{width:100%;height:100%;border:0;display:block}
#snd,#mus{background:var(--card);border:1px solid var(--idle);border-radius:10px;padding:8px 14px;font-size:17px;line-height:1.2;opacity:.65}
#snd.on,#mus.on{opacity:1;border-color:var(--waitt)}
#snd.locked,#mus.locked{opacity:1;border-color:var(--waitt);animation:lk 1.6s infinite}@keyframes lk{50%{background:var(--sel)}}
#err{color:var(--new);padding:0 28px}
main{flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr)}
nav{overflow:auto;padding:16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
section{overflow:auto;padding:24px 36px}
.grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:6px 4px 0}
.grp.w{color:var(--waitt);font-weight:700}
.row{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:var(--card);border:0;border-left:6px solid var(--idle);border-radius:12px;padding:14px 16px;cursor:pointer}
.row.wait{border-color:var(--wait)}.row.work{border-color:var(--work);opacity:.85}.row.watch{border-color:var(--work);opacity:.65}.row.rien{opacity:.55}
.row.sel{background:var(--sel);outline:2px solid var(--fg)}
.row.wait.sel{outline-color:var(--wait)}
.row.unseen:not(.sel){box-shadow:inset 0 0 0 2px var(--new)}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.r1 b{font-size:15px;font-weight:600}
.age{font-size:15px;font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.r2{font-size:12px;color:var(--dim);font-weight:600}
.wait .r2{color:var(--waitt);font-weight:700}
.work .r2,.watch .r2{color:var(--workt);font-weight:700}
.row.dl{border-color:var(--waitt)}
.r3{font-size:12px;font-weight:700;color:var(--dim)}
.r3.hot{color:var(--new)}.r3.soon{color:var(--waitt)}
.grp.d{color:var(--new);font-weight:700}
.dlbox,.zbox{margin-top:22px;padding:14px 16px;background:var(--card);border-radius:12px;display:flex;flex-direction:column;gap:10px}
.dlbox .big,.zbox .big{font-size:17px;font-weight:700}.dlbox .big.hot{color:var(--new)}.dlbox .big.soon{color:var(--waitt)}
.dlbox .btns,.zbox .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dlbox button,.dlbox input,.zbox button,.zbox input{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--idle);background:var(--bg);color:var(--fg)}
.dlbox input.note{flex:1;min-width:200px}
li.it{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
li.it>span{flex:1}
span.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
button.more{display:inline-block;margin:0;font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--idle);background:transparent;color:var(--workt);cursor:pointer;font-weight:600}
.info{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bg);font-weight:400;font-size:13px;line-height:1.4}
.info p{margin:6px 0}.info .pr{color:var(--dim);font-style:italic}
.vd{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:6px;border:1px solid var(--idle)}
.vd.v-ok{color:#3fb950;border-color:#3fb950}.vd.v-old{color:var(--waitt);border-color:var(--waitt)}.vd.v-unk{color:var(--dim)}
li.it small{font-size:12px;font-weight:400;color:var(--dim)}
li.it small.old{color:var(--waitt);font-weight:600}
.ok{flex-shrink:0;margin-left:16px;font-size:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--idle);background:transparent;color:var(--dim);cursor:pointer}
.rest summary{cursor:pointer;color:var(--dim);font-size:12px;margin-top:20px}
.rest button{margin-left:10px;font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--idle);background:transparent;color:var(--fg)}
.rest li{color:var(--dim);margin:6px 0;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:14px 18px;border-radius:12px;display:none;gap:16px;align-items:center;max-width:90vw;font-size:14px;z-index:40}
#toast button{font:inherit;font-weight:700;background:transparent;border:0;color:var(--bg);text-decoration:underline;padding:8px;cursor:pointer}
.lh{display:flex;justify-content:space-between;align-items:center}
.all{font-size:12px;padding:6px 12px;border-radius:10px;border:1px solid var(--idle);background:transparent;color:var(--dim);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600}
.row.err{border-color:var(--new);background:color-mix(in srgb,var(--new) 14%,var(--card))}
.row.err .r2{color:var(--new);font-weight:700}
.row.cmp{flex-direction:row;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 14px}
.row.cmp .r1{flex:1;min-width:0}.row.cmp .r1 b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.cmp .age{font-size:12px}.row.cmp .r2{font-size:12px;white-space:nowrap}
.flash{animation:fl .6s 4}@keyframes fl{50%{background:var(--new)}}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.dh h2{margin:0;font-size:24px;font-weight:600}
.dh .age{font-size:24px;color:var(--fg)}
.sub{color:var(--dim);font-size:13px;margin:4px 0 18px}
.lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin:20px 0 10px;color:var(--dim)}
.lab.w{color:var(--waitt)}
ol.q{margin:0;padding-left:28px;font-size:15px;font-weight:600;line-height:1.35;display:flex;flex-direction:column;gap:10px}
ul.t{margin:0;padding-left:26px;font-size:14px;line-height:1.35;list-style:'☐  ';display:flex;flex-direction:column;gap:8px}
ul.a{margin:0;padding-left:26px;font-size:14px;color:var(--dim);text-decoration:line-through;display:flex;flex-direction:column;gap:6px}
ul.c{margin:0;padding-left:26px;font-size:14px;opacity:.65;display:flex;flex-direction:column;gap:8px}
.none{color:var(--dim);font-size:14px}
.draft{margin-top:18px;color:var(--waitt);font-size:13px}
.badge{display:inline-block;margin-top:2px;font-size:12px;font-weight:700;color:var(--waitt)}
.pill{font-size:14px;font-weight:700;color:var(--new);border:1px solid var(--new);border-radius:999px;padding:6px 12px;white-space:nowrap}.pill[hidden]{display:none}
#dsk{background:transparent;border:1px solid var(--idle);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--dim)}
#down{position:relative;z-index:30;flex-shrink:0;background:var(--new);color:#fff;font-size:18px;font-weight:700;padding:14px 28px;text-align:center}
body.stale main{opacity:.45;filter:grayscale(.7)}body.stale #desk{filter:grayscale(.7) brightness(.55)}
.src{font-style:normal;font-size:10px;font-weight:600;color:var(--dim);border:1px solid var(--idle);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:middle}
.row.cmp:not(.z){flex-wrap:wrap}.row.cmp:not(.z) .r3{flex-basis:100%}
.r3.stl,.stall{color:var(--waitt)}.stall{font-size:13px;font-weight:700;margin-top:4px}
details.zg{margin-top:8px}details.zg summary{cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:6px 4px}
.zl{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.row.z{opacity:.7;padding:8px 14px}.row.z .r3{font-size:12px;white-space:nowrap}
.lt{font-size:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--idle);background:transparent;color:var(--workt);cursor:pointer;font-weight:600}
.acts{display:flex;align-items:flex-start;gap:8px}li.it>span.acts{flex:none}.acts .ok{margin-left:0}
.lat{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--dim)}
.lat input{font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--idle);background:var(--bg);color:var(--fg)}
.lat button{font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--idle);background:transparent;color:var(--fg);cursor:pointer}
.rest small{color:var(--dim);margin-left:8px}
#desk{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;cursor:pointer;text-align:center}
#desk .dn{font-size:min(52vh,52vw);font-weight:800;line-height:1}
#desk .dt{font-size:min(4vh,5vw);color:var(--dim)}
#desk ul{list-style:none;margin:0;padding:0;font-size:min(6vh,6vw);font-weight:600;display:flex;flex-direction:column;gap:1vh}
#desk li span{color:var(--dim);font-weight:400;margin-left:2vw}
#desk[data-c=amb] .dn{color:var(--waitt)}#desk[data-c=hot] .dn{color:var(--new)}#desk[data-c=ok] .dn{color:#3fb950;opacity:.6}
#desk.night{background:#000}#desk.night>*{filter:brightness(.5) saturate(.7)}
details.rep,details.res{margin-top:18px;padding:12px 16px;background:var(--card);border-radius:12px}
details.rep>summary,details.res>summary{cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--workt);padding:4px 0}
.rq{padding:10px 0;border-bottom:1px solid var(--line)}.rq .qt{font-size:14px;font-weight:600;margin-bottom:8px}
.rb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pk{font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid var(--idle);background:transparent;color:var(--fg);cursor:pointer}
.pk.on{background:var(--waitt);border-color:var(--waitt);color:var(--bg)}
.rep input,.rep textarea,.rcp textarea,#raf input{font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--idle);background:var(--bg);color:var(--fg)}
.rb input{flex:1;min-width:180px}
.rep textarea,.rcp textarea{width:100%;resize:vertical}
.rep textarea.free{margin:6px 0 4px}
.prep{margin-top:12px;font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--workt);background:transparent;color:var(--workt);cursor:pointer}
.pv{margin-top:14px;padding-top:12px;border-top:2px solid var(--work)}
.pvb{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.go{font-size:16px;font-weight:700;padding:14px 22px;border-radius:12px;border:0;background:var(--work);color:#fff;cursor:pointer}
.go:disabled{opacity:.5}
.cn{font-size:14px;padding:12px 16px;border-radius:10px;border:1px solid var(--idle);background:transparent;color:var(--fg);cursor:pointer}
.serr{margin-top:10px;color:var(--new);font-weight:600;font-size:13px}.sok{margin-top:10px;color:#3fb950;font-weight:700}
.warn{color:var(--waitt);font-size:13px;margin:6px 0}
.res dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;line-height:1.4}
.res dt{color:var(--dim);font-weight:700}.res dd{margin:0}
#rafb{background:transparent;border:1px solid var(--workt);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--workt);font-weight:600}
#raf{position:fixed;inset:0;z-index:25;background:var(--bg);display:none;flex-direction:column;overflow:auto}
#raf .rh{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line)}
#raf .rh b{flex:1;font-size:16px}
#raf .rh .pg{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--waitt)}
#raf .card{max-width:900px;width:100%;margin:0 auto;padding:24px}
#raf .sp{font-size:15px;color:var(--dim);font-weight:600}
#raf .qq{font-size:26px;font-weight:700;line-height:1.3;margin:12px 0 10px}
#raf .st{font-size:13px;font-weight:700;color:var(--waitt);margin-bottom:6px}
#raf .ra{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
#raf .ra .pk{font-size:17px;padding:14px 26px}
#raf .rs{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
#raf .oth{display:flex;gap:10px;margin-top:12px}#raf .oth input{flex:1;font-size:16px}
.rcp{max-width:900px;width:100%;margin:0 auto;padding:24px}
.rcp h2{margin:0 0 6px;font-size:22px}
.rcs{margin-top:18px;padding:14px 16px;background:var(--card);border-radius:12px}
.rcs .pvb{margin-top:12px}
@media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}section{padding:16px 20px}}
</style></head><body>
<header><img src="/assets/logo.png" alt="Miniguet" width="40" height="40" style="margin:-6px 0"><h1>En attente de moi</h1><span class="count" id="n">0</span><span class="pill" id="dlp" hidden></span><span id="links"></span><button id="rafb">Rafale</button><button id="dsk">Mode bureau</button><button id="snd" class="ic" title="Sons">🔕</button><button id="mus" class="ic" title="Musique d'ambiance">♪</button></header>
<div id="err"></div>
<div id="toast"><span id="tmsg"></span><button id="tund">Annuler</button></div>
<main><nav id="list"></nav><section id="detail"></section></main>
<div id="desk"></div><div id="raf"></div>
<div id="frame" hidden><iframe id="fr" title="Miniguet"></iframe></div>
<script src="/assets/sound.js"></script>
<script>
let off=0,prev=new Map(),first=true,SEL=null,last=null,VIEW=null;
const $=id=>document.getElementById(id);
/* Stats / Daily / Historique open in an overlay on top of this page, with their own address (/stats, /daily, /daily/history):
   this page, and so the music, never unloads; a refresh on one of those addresses reopens it; "back" walks through them. */
const OV=['/stats','/daily','/daily/history'];
function showFrame(href){$('fr').contentWindow.location.replace(href+(href.includes('?')?'&':'?')+'embed=1');$('frame').hidden=false}
function openFrame(href){history.pushState({fr:1,href},'',href);showFrame(href)}
function closeFrame(){if($('frame').hidden)return;$('frame').hidden=true;$('fr').contentWindow.location.replace('about:blank')}
function goHome(){closeFrame();if(location.pathname!=='/')history.pushState(null,'','/')}
$('links').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();openFrame(a.getAttribute('href'))});
window.addEventListener('message',e=>{const m=e.data;if(e.origin!==location.origin||!m)return;
 if(m.mg==='close')goHome();else if(m.mg==='open'&&OV.includes(String(m.href).split('?')[0]))openFrame(m.href)});
window.addEventListener('popstate',e=>{const s=e.state;if(s&&s.fr)showFrame(s.href);else closeFrame()});
if(OV.includes(location.pathname)){const u=location.pathname+location.search;history.replaceState(null,'','/');history.pushState({fr:1,href:u},'',u);showFrame(u)}
function sndUI(){const S=MG.sound,a=S.soundState(),b=S.musicState();
 $('snd').textContent=a==='off'?'🔕':'🔔';$('snd').className='ic '+a;
 const dbg=S.debug();
 $('snd').title=a==='off'?'Activer les sons':a==='locked'?'Son en attente : touche l\'écran pour l\'activer':'Sons activés (toucher pour couper)'+(dbg.lastChime?' · dernier bip '+new Date(dbg.lastChime.at).toLocaleTimeString('fr-FR')+' ('+dbg.lastChime.kind+', '+dbg.lastChime.ctx+')':' · aucun bip depuis le chargement');
 $('mus').className='ic '+b;
 $('mus').title=b==='off'?'Lancer la musique d\'ambiance':b==='locked'?'Musique en attente : touche l\'écran pour la lancer':'Musique en cours (toucher pour couper)'}
$('snd').onclick=()=>MG.sound.toggleSound();$('mus').onclick=()=>MG.sound.toggleMusic();
MG.sound.onChange(sndUI);MG.sound.restore();sndUI();
function age(ms){const s=Math.max(0,Math.floor((Date.now()+off-ms)/1000));
 if(s<60)return s+' s';const m=Math.floor(s/60);if(m<60)return m+' min';
 const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');return h>=24?Math.floor(h/24)+' j '+h%24+' h '+mm:h+' h '+mm}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const HID=new Set();let RESTOPEN=false,SNOPEN=false,ZOPEN=false,LASTHTML='';
const SN=new Map(),LATER=new Set();  // SN: item key -> until, optimistic until the next /api/state; LATER: items showing the "Plus tard" choices
const nowS=()=>Date.now()+off;
const snz=x=>!!x.snooze&&x.snooze.until>nowS();
// snoozed points of a session: [[text, until_ms]]
function sn(x){if(!(x.snoozed||[]).length&&!SN.size)return [];
 const m=new Map((x.snoozed||[]).map(s=>[s.text,s.until])),p=x.address+'\u0001';
 for(const [k,u] of SN)if(k.startsWith(p))m.set(k.slice(p.length),u);
 return [...m].filter(([,u])=>u>nowS())}
const vis=(x,l)=>{const z=new Set(sn(x).map(a=>a[0]));return (l||[]).filter(t=>!HID.has(x.address+'\u0001'+t)&&!z.has(t))};
const op=x=>vis(x,x.q&&x.q.open), td=x=>vis(x,x.q&&x.q.todo);
// done + (questions open | to-do | analysis pending | analysis failed) = needs me
const needs=x=>x.status==='error'||x.status==='done'&&(!x.q||x.q.pending||x.q.error||op(x).length>0||td(x).length>0);
const bgn=x=>(x.q&&x.q.bg)?(x.q.bg.monitors+x.q.bg.shells):0;
const watch=x=>x.status==='done'&&!needs(x)&&bgn(x)>0;
const cls=x=>x.status==='error'?'err':needs(x)?'wait':watch(x)?'watch':x.status==='done'?'rien':'work';
function label(x){
 if(x.status==='error')return 'en erreur';
 if(needs(x)){
  if(x.q&&x.q.pending)return 'lecture du dernier message…';
  if(x.q&&x.q.error)return 'analyse impossible';
  const a=op(x).length,b=td(x).length,p=[];
  if(a)p.push(a+' question'+(a>1?'s':''));
  if(b)p.push(b+' à faire');
  return p.join(' · ');
 }
 if(watch(x)){const m=x.q.bg.monitors,s=x.q.bg.shells,p=[];
  if(m)p.push(m+' monitor'+(m>1?'s':''));if(s)p.push(s+' shell'+(s>1?'s':''));return 'surveille ('+p.join(', ')+')'}
 if(x.status==='done')return 'fini';
 return x.status==='working'?'travaille':x.status;
}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
function dlDays(x){if(!x.deadline)return null;const[a,b,c]=x.deadline.date.split('-').map(Number);
 const t=new Date();return Math.round((new Date(a,b-1,c)-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5)}
function dlText(x){const n=dlDays(x);if(n===null)return '';
 const d=x.deadline.date.split('-').reverse().slice(0,2).join('/');
 return n<0?'en retard de '+(-n)+' j ('+d+')':n===0?"aujourd'hui":n===1?'demain':n<7?'dans '+n+' j ('+d+')':d}
const dlCls=x=>{const n=dlDays(x);return n===null?'':n<=0?'hot':n<=1?'soon':''};
const name=x=>x.space+(x.tab&&x.tab!=='1'?' / '+x.tab:'');

 +'<div class="pvb">'+(cancel?'<button class="cn" data-cn="'+esc(a)+'">Annuler</button>':'<span></span>')+'<button class="go" data-go="'+esc(a)+'"'+(p.busy?' disabled':'')+'>'+(p.busy?'Envoi…':'Envoyer à '+esc(label))+'</button></div>'}
function repBox(x){const a=x.address,p=PREP.get(a),n=answered(x).length,w=sendWarn(x);
 if(x.source)return '<div class="none" style="margin-top:14px">Répondre : ancien herdr, non supporté</div>';
 return '<details class="rep"'+(REPOPEN.has(a)||p?' open':'')+'><summary>Répondre'+(n?' · '+plural(n,'réponse')+' saisie'+(n>1?'s':''):'')+'</summary>'
  +(w?'<div class="warn">⚠ '+esc(w)+'</div>':'')
  +'<textarea class="free" rows="2" data-f="1" autocapitalize="sentences" placeholder="Message libre en tête (optionnel)">'+esc(FREE.get(a)||'')+'</textarea>'
  +op(x).map((t,i)=>{const v=ANS.get(ik(a,t))||{p:'',t:''};return '<div class="rq"><div class="qt">'+(i+1)+'. '+esc(t)+'</div><div class="rb">'
   +['Oui','Non'].map(o=>'<button class="pk'+(v.p===o?' on':'')+'" data-pk="'+o+'" data-t="'+esc(t)+'">'+o+'</button>').join('')
   +'<input data-ra="'+esc(t)+'" value="'+esc(v.t)+'" inputmode="text" autocapitalize="sentences" enterkeyhint="done" placeholder="Autre réponse ou précision (dictée possible)"></div></div>'}).join('')
  +(p?'<div class="pv"><div class="lab" style="margin:0 0 8px">Message qui sera envoyé · modifiable</div>'+pvBox(a,p,x.space)+'</div>':'<button class="prep">Préparer le message</button>')+'</details>'}
function note(msg){$('tmsg').textContent=msg;$('tund').style.display='none';$('toast').style.display='flex';clearTimeout(TT);TT=setTimeout(()=>$('toast').style.display='none',8000)}
// the only call that types into an agent; the server re-checks everything (whitelist, idle, no draft, size)
async function sendTo(a,redraw){const p=PREP.get(a);if(!p||p.busy)return 0;p.busy=true;p.err='';redraw();let r;
 try{r=await (await fetch('/api/send',{method:'POST',body:JSON.stringify({address:a,text:p.text,questions:p.qs,since_ms:p.since})})).json()}
 catch(e){r={error:'Mac injoignable : '+e.message}}
 p.busy=false;
 if(!r.ok){p.err=r.error||'erreur inconnue';if(r.since_ms)p.since=r.since_ms;redraw();return 0}
 for(const k of [...ANS.keys()])if(k.startsWith(a+'\u0001'))ANS.delete(k);
 FREE.delete(a);PREP.delete(a);const x=agOf(a),n=p.qs.length;
 note((n?plural(n,'réponse')+' envoyée'+(n>1?'s':''):'Message envoyé')+' à '+(x?x.space:a));
 dismissMany(a,p.qs,false,null);redraw();return n||1}
$('detail').addEventListener('click',e=>{const x=agOf(SEL);if(!x)return;
 const pk=e.target.closest('button[data-pk]');if(pk){const k=ik(SEL,pk.dataset.t),v=ANS.get(k)||{p:'',t:''};v.p=v.p===pk.dataset.pk?'':pk.dataset.pk;ANS.set(k,v);PREP.delete(SEL);return rr()}
 if(e.target.closest('button.prep')){if(!prepare(SEL,answered(x),x.since_ms))note('Rien à envoyer : réponds à au moins une question ou écris un message');return rr()}
 const cn=e.target.closest('button[data-cn]');if(cn){PREP.delete(cn.dataset.cn);return rr()}
 const go=e.target.closest('button[data-go]');if(go)sendTo(go.dataset.go,rr)});
$('detail').addEventListener('input',e=>{const d=e.target.dataset;
 if(d.ra!==undefined){const k=ik(SEL,d.ra),v=ANS.get(k)||{p:'',t:''};v.t=e.target.value;ANS.set(k,v);PREP.delete(SEL)}
 else if(d.f){FREE.set(SEL,e.target.value);PREP.delete(SEL)}
 else if(d.pv&&PREP.get(d.pv))PREP.get(d.pv).text=e.target.value});
// ---- rafale: one open question at a time, answers piled up per session, nothing sent before the recap ----
let RAF=null;   // {L:[[addr,text]], i, act:{key:'p'|'d'}, since:{addr:status_ms at start}, other, recap, ss:[addr], sent:{addr:n}}
function rafList(){const byNew=(x,y)=>(y.since_ms||0)-(x.since_ms||0);
 const ag=last.agents.filter(x=>!snz(x)&&!x.source&&op(x).length)
  .sort((x,y)=>(!!y.deadline-!!x.deadline)||(x.deadline&&y.deadline&&x.deadline.date.localeCompare(y.deadline.date))||byNew(x,y));
 return ag.flatMap(x=>op(x).map(t=>[x.address,t]))}
$('rafb').onclick=()=>{if(!last)return;RAF={L:rafList(),i:0,act:{},since:Object.fromEntries(last.agents.map(x=>[x.address,x.since_ms])),other:false,recap:false,sent:{}};drawRaf()};
function rafCard(){const n=RAF.L.length,[a,t]=RAF.L[RAF.i],x=agOf(a)||{space:a},k=ik(a,t),v=ANS.get(k)||{p:'',t:''},act=RAF.act[k];
 return '<div class="rh"><button class="cn" data-r="prev"'+(RAF.i?'':' disabled')+'>← Précédente</button><b>Rafale</b><span class="pg">'+(RAF.i+1)+'/'+n+'</span><button class="cn" data-r="end">Terminer</button></div>'
 +'<div class="card"><div class="sp">'+esc(name(x))+(x.since_ms?' · '+age(x.since_ms):'')+'</div>'
 +(act?'<div class="st">'+(act==='p'?'Reportée d\'1 h':'Retirée')+'</div>':'')
 +'<div class="qq">'+esc(t)+'</div><span class="meta">'+since(((x.q||{}).ts||{})[t])+'<button class="more" data-r="info">'+(OPENI.has(k)?'Masquer':'Plus d\'infos')+'</button></span><div id="rafinfo">'+infoBox(a,t)+'</div>'
 +'<div class="ra">'+['Oui','Non'].map(o=>'<button class="pk'+(v.p===o?' on':'')+'" data-r="'+o+'">'+o+'</button>').join('')+'<button class="pk'+(v.t?' on':'')+'" data-r="autre">Autre…</button></div>'
 +(RAF.other||v.t?'<div class="oth"><input id="rafo" value="'+esc(v.t)+'" inputmode="text" autocapitalize="sentences" enterkeyhint="done" placeholder="Ta réponse (dictée possible)"><button class="go" data-r="ok">Valider</button></div>':'')
 +'<div class="rs"><button class="cn" data-r="skip">Passer (revient dans 1 h)</button><button class="cn" data-r="dis">Plus pertinent</button></div></div>'}
function rafRecap(){const ss=RAF.ss.filter(a=>PREP.get(a)||RAF.sent[a]),tot=ss.reduce((s,a)=>s+(RAF.sent[a]||PREP.get(a).qs.length),0),todo=ss.filter(a=>!RAF.sent[a]);
 let h='<div class="rh"><button class="cn" data-r="back"'+(RAF.L.length?'':' disabled')+'>← Questions</button><b>Récapitulatif</b><button class="cn" data-r="close">Fermer</button></div><div class="rcp">';
 if(!ss.length)return h+'<h2>Aucune réponse à envoyer</h2><div class="sub">Les questions passées reviendront dans 1 h.</div></div>';
 h+='<h2>Envoyer '+plural(tot,'réponse')+' à '+plural(ss.length,'session')+'</h2><div class="sub">'+(todo.length<ss.length?'Les messages restants sont encore modifiables.':'Rien n\'est encore parti. Relis et modifie chaque message avant de l\'envoyer.')+'</div>';
 for(const a of ss){const x=agOf(a),p=PREP.get(a),w=x?sendWarn(x):'session fermée';
  h+='<div class="rcs"><div class="lab" style="margin:0 0 8px">'+esc(x?name(x):a)+'</div>'
   +(RAF.sent[a]?'<div class="sok">✓ Envoyé</div>':(w?'<div class="warn">⚠ '+esc(w)+'</div>':'')+pvBox(a,p,x?x.space:a,false))+'</div>'}
 return h+(todo.length>1?'<div class="pvb"><button class="cn" data-r="close">Fermer sans envoyer</button><button class="go" data-r="all">Tout envoyer ('+todo.length+')</button></div>':'')+'</div>'}
function drawRaf(){const R=$('raf');if(!RAF){R.style.display='none';R.innerHTML='';return}R.style.display='flex';
 R.innerHTML=RAF.recap?rafRecap():RAF.L.length?rafCard():'<div class="rh"><b>Rafale</b><button class="cn" data-r="close">Fermer</button></div><div class="card"><div class="none">Aucune question ouverte.</div></div>'}
function rafInfo(){const e=$('rafinfo'),[a,t]=RAF.L[RAF.i];if(e)e.innerHTML=infoBox(a,t)}
function rafNext(){RAF.other=false;if(RAF.i<RAF.L.length-1){RAF.i++;drawRaf()}else rafEnd()}
function rafEnd(){RAF.recap=true;RAF.other=false;RAF.ss=[...new Set(RAF.L.map(c=>c[0]))];
 for(const a of RAF.ss){   // questions from the rafale list, not the live state: a session that started working since keeps its answers
  const qs=RAF.L.filter(c=>c[0]===a&&ansOf(ik(a,c[1]))).map(c=>c[1]);if(!RAF.sent[a]&&!prepare(a,qs,RAF.since[a]))PREP.delete(a)}
 drawRaf()}
$('raf').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!RAF)return;const r=b.dataset.r;
 if(b.dataset.go){const a=b.dataset.go,n=await sendTo(a,drawRaf);if(n){RAF.sent[a]=n;drawRaf()}return}
 if(r==='close'){RAF=null;rr();return drawRaf()}
 if(r==='back'){RAF.recap=false;return drawRaf()}
 if(r==='all'){for(const a of RAF.ss.filter(a=>PREP.get(a)&&!RAF.sent[a])){const n=await sendTo(a,drawRaf);if(n)RAF.sent[a]=n}return drawRaf()}
 if(r==='end')return rafEnd();
 if(r==='prev'){RAF.i=Math.max(0,RAF.i-1);RAF.other=false;return drawRaf()}
 const [a,t]=RAF.L[RAF.i],k=ik(a,t);
 if(r==='info')return toggleInfo(a,t,()=>{const f=document.activeElement;if(f&&f.id==='rafo')rafInfo();else drawRaf()});
 if(r==='Oui'||r==='Non'){ANS.set(k,{p:r,t:''});delete RAF.act[k];return rafNext()}
 if(r==='autre'){RAF.other=true;drawRaf();const i=$('rafo');if(i)i.focus();return}
 if(r==='ok'){const v=($('rafo')||{}).value||'';if(v.trim()){ANS.set(k,{p:'',t:v});delete RAF.act[k];rafNext()}return}
 if(r==='skip'){ANS.delete(k);RAF.act[k]='p';snoozeItem(a,t,Date.now()+36e5);return rafNext()}
 if(r==='dis'){ANS.delete(k);RAF.act[k]='d';dismissMany(a,[t],false,'Retiré : « '+short(t)+' »');return rafNext()}});
$('raf').addEventListener('input',e=>{if(!RAF)return;const d=e.target.dataset;
 if(e.target.id==='rafo'){const [a,t]=RAF.L[RAF.i];ANS.set(ik(a,t),{p:'',t:e.target.value})}
 else if(d.pv&&PREP.get(d.pv))PREP.get(d.pv).text=e.target.value});
$('raf').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rafo'){e.preventDefault();$('raf').querySelector('[data-r=ok]').click()}});
$('list').addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('zg'))ZOPEN=e.target.open},true);
let okAt=0,failed=false,B=null;const t0=Date.now();
const down=()=>failed||Date.now()-(okAt||t0)>15000;
function banner(){const dn=down();document.body.classList.toggle('stale',dn);
 if(!dn){if(B){B.remove();B=null}return}
 if(!B){B=document.createElement('div');B.id='down';document.body.prepend(B)}
 B.textContent='Mac injoignable depuis '+age((okAt||t0)+off)+(okAt?' — dernière mise à jour '+fmtH(okAt):'')}
async function tick(){let d;
 try{const r=await fetch('/api/state');d=await r.json();if(d.error)throw new Error(d.error)}
 catch(e){failed=true;$('err').textContent='Erreur : '+e.message;return banner()}
 failed=false;okAt=Date.now();
 try{$('err').textContent='';render(d)}catch(e){$('err').textContent='Erreur : '+e.message}
 banner()}
// desk mode: big number readable from afar; a tap closes it
let DESK=false;try{DESK=localStorage.getItem('desk')==='1'}catch(e){}
function setDesk(v){DESK=v;try{v?localStorage.setItem('desk','1'):localStorage.removeItem('desk')}catch(e){}renderDesk()}
function renderDesk(){const D=$('desk');D.style.display=DESK&&VIEW?'flex':'none';if(!DESK||!VIEW)return;
 const h=new Date().getHours();D.classList.toggle('night',h>=22||h<7);
 D.dataset.c=VIEW.hot?'hot':VIEW.nw?'amb':'ok';
 const html='<div class="dn">'+VIEW.nw+'</div><div class="dt">'+(VIEW.nw?'à toi':"rien ne t'attend")+'</div><ul>'
  +VIEW.names.map(x=>'<li>'+esc(name(x))+'<span>'+(x.since_ms?age(x.since_ms):'')+(x.deadline?' · ⏰ '+esc(dlText(x)):'')+'</span></li>').join('')+'</ul>';
 if(html!==D.dataset.h){D.innerHTML=html;D.dataset.h=html}}
$('dsk').onclick=()=>setDesk(true);$('desk').onclick=()=>setDesk(false);
// keep the screen on while the page is visible; failures are ignored
let WL=null;async function wake(){try{if(document.visibilityState==='visible'&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){WL=null}}
document.addEventListener('visibilitychange',wake);document.addEventListener('click',wake);wake();
tick();setInterval(tick,2000);setInterval(banner,1000);
</script></body></html>
