<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miniguet</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#0b0d12">
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="stylesheet" href="/assets/ui-sdk/0.1.0-beta.1/web.css">
<link rel="stylesheet" href="/assets/app/style.css">
<script type="module" src="/assets/ui-sdk/0.1.0-beta.1/web.js"></script>
<script src="/assets/sound.js"></script>
<script type="module" src="/assets/app/app.js"></script>
</head><body>
<header id="top">
  <img src="/assets/logo.png" alt="Miniguet" width="40" height="40">
  <h1>En attente de moi</h1>
  <span class="count-l">À toi</span><span class="count" id="n">0</span>
  <span class="pill" id="dlp" hidden></span>
  <span id="links"></span>
  <ui-button><button id="rafb" class="act" data-variant="solid">Rafale</button></ui-button>
  <ui-menu id="menu">
    <ui-menu-trigger><button aria-label="Plus d'options" class="icon">⋯</button></ui-menu-trigger>
    <ui-menu-content>
      <ui-menu-item value="desk">Mode bureau</ui-menu-item>
      <ui-menu-item value="sound" id="mi-sound">Sons</ui-menu-item>
      <ui-menu-item value="music" id="mi-music">Musique</ui-menu-item>
      <ui-menu-item value="theme" id="mi-theme">Thème clair</ui-menu-item>
    </ui-menu-content>
  </ui-menu>
</header>
<div id="err" role="alert"></div>
<main id="main">
  <nav id="list" aria-label="Sessions"></nav>
  <section id="detail" aria-label="Session"></section>
</main>
<div id="toast" role="status"><span id="tmsg"></span><button id="tund">Annuler</button><button id="tx" aria-label="Fermer">×</button></div>
<div id="desk" hidden></div>
<ui-dialog id="pv-dialog">
  <ui-dialog-backdrop hidden></ui-dialog-backdrop>
  <ui-dialog-content hidden>
    <ui-dialog-title>Message qui sera envoyé</ui-dialog-title>
    <div id="pv-body"></div>
  </ui-dialog-content>
</ui-dialog>
<ui-dialog id="raf-dialog">
  <ui-dialog-backdrop hidden></ui-dialog-backdrop>
  <ui-dialog-content hidden class="full">
    <ui-dialog-title>Rafale</ui-dialog-title>
    <div id="raf-body"></div>
  </ui-dialog-content>
</ui-dialog>
<div id="frame" hidden><iframe id="fr" title="Miniguet"></iframe></div>
</body></html>
