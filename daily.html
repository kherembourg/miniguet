<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miniguet · Daily</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#0f1115">
<style>
:root{--bg:#0f1115;--card:#181b22;--sel:#262b38;--fg:#e8eaf0;--dim:#9aa1b4;--wait:#f5a524;--waitt:#f5a524;--work:#4c8dff;--workt:#7aa7ff;--idle:#4b5163;--new:#ff4d4d;--line:#232834}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--card:#fff;--sel:#e4e8f1;--fg:#14161b;--dim:#5d6477;--waitt:#a35f00;--workt:#2f63c9;--idle:#b7bccb;--line:#dde1ea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line)}
h1{font-size:20px;font-weight:600;margin:0;flex:1}
a.back{color:var(--workt);font-size:15px;text-decoration:none;padding:10px 4px}
button,select{font:inherit;color:inherit}
main{padding:20px 28px 40px;max-width:920px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar button,.bar select{padding:10px 16px;border-radius:10px;border:1px solid var(--idle);background:var(--card);cursor:pointer}
.bar button:disabled{opacity:.5;cursor:default}
.bar .gap{flex:1}
.meta{color:var(--dim);font-size:13px;margin:10px 0 0;line-height:1.5}
#err{color:var(--new);margin:14px 0 0;font-weight:600}
.say{margin-top:18px;background:var(--card);border-left:6px solid var(--waitt);border-radius:14px;padding:16px 20px}
.lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin:0 0 8px;color:var(--dim)}
.say .lab{color:var(--waitt)}
.say p{margin:0 0 8px;font-size:18px;line-height:1.45}
.say p:last-child{margin:0}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.num{background:var(--card);border-radius:12px;padding:10px 14px}
.num .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
.num .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
.topic{background:var(--card);border-radius:14px;padding:14px 18px;margin-bottom:10px}
.topic h3{margin:0 0 2px;font-size:16px;font-weight:600}
.topic .sub{font-size:12px;color:var(--dim);margin-bottom:6px}
.topic ul,.blk ul{margin:6px 0 0;padding-left:20px;line-height:1.45;font-size:15px}
.topic li,.blk li{margin:4px 0}
.blk{background:var(--card);border-left:6px solid var(--work);border-radius:14px;padding:14px 18px}
.blk li small{color:var(--dim);font-size:12px;font-weight:600}
.say .grp{color:var(--waitt)}
h2.mine{margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.topic a,.blk a{color:var(--workt)}
.empty,.rest{color:var(--dim);line-height:1.5}
@media (max-width:820px){main{padding:16px 16px 40px}header{padding:12px 16px}.say p{font-size:16px}}
</style></head><body>
<header><img src="/assets/logo.png" alt="Miniguet" width="40" height="40" style="margin:-6px 0"><a class="back" href="/">← Retour</a><h1>Daily</h1></header>
<main>
<div class="bar">
  <select id="day" aria-label="Jour"></select>
  <button id="regen">Régénérer</button>
  <span class="gap"></span>
  <a class="back" href="/daily/history">Historique</a>
  <button id="copy">Copier le texte à dire</button>
  <button id="copyn">Copier les notes</button>
</div>
<p class="meta" id="meta"></p>
<p id="err"></p>
<div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
let cur = null, timer = null;

const dur = ms => { const m = Math.round((ms || 0) / 60000); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0"); };
const day = (d, o) => new Date(d).toLocaleDateString("fr-FR", o);
const when = ms => day(ms, {weekday: "short", day: "2-digit", month: "2-digit"}) + " " + new Date(ms).toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"});

const speech = s => s.annoncer.map(p => p.replace(/^[^:]{1,20} : /, ""));   // the spoken text, without the group labels
const words = s => speech(s).join(" ").split(/\s+/).filter(Boolean).length;
const mmss = n => { const sec = Math.round(n / 150 * 60); return sec < 60 ? sec + " s" : Math.floor(sec / 60) + " min " + String(sec % 60).padStart(2, "0"); };
let LINEAR = {};
function linked(parent, text) {   // ticket ids (ENG-12, ROM-3) become links when a base URL is configured
  const re = /\b([A-Z]{2,5})-(\d+)\b/g; let i = 0, m;
  while ((m = re.exec(text))) {
    if (!LINEAR[m[1]]) continue;
    parent.append(text.slice(i, m.index));
    const a = el("a", null, m[0]); a.href = LINEAR[m[1]] + m[0]; a.target = "_blank"; a.rel = "noopener"; parent.append(a);
    i = m.index + m[0].length;
  }
  parent.append(text.slice(i));
}
function plain(s) {   // spoken text only, ready to paste or read
  return speech(s).join("\n\n").trim();
}
function notes(s) {   // the detailed notes, plain text
  const out = ["Daily du " + day(s.to_ms, {weekday: "long", day: "numeric", month: "long"}), ""];
  for (const t of s.sujets) if (t.puces.length) out.push(t.sujet, ...t.puces.map(p => "- " + p), "");
  if (s.bloque.length) out.push("Bloqué / en attente", ...s.bloque.map(b => "- [" + b.sujet + "] " + b.texte));
  return out.join("\n").trim();
}

function render(s) {
  const out = $("out");
  out.textContent = "";
  $("err").textContent = s.erreur || "";
  if (s.empty) {
    out.append(el("p", "empty", "Aucun résumé pour ce jour. Il se prépare à 11 h 50 les jours ouvrés ; « Régénérer » en lance un maintenant."));
    $("meta").textContent = "";
    return;
  }
  const c = s.chiffres;
  $("meta").textContent = "Généré le " + when(s.generated_ms) + " · fenêtre du " + when(s.from_ms) + " au " + when(s.to_ms)
    + (s.duree_s ? " · " + s.duree_s + " s" : "");
  if (s.annoncer.length) {
    const b = el("div", "say");
    b.append(el("div", "lab", (s.date === new Date().toLocaleDateString("sv") ? "À dire aujourd'hui" : "À dire à l'oral") + " · " + words(s) + " mots, environ " + mmss(words(s))));
    for (const p of s.annoncer) {
      const m = p.match(/^([^:]{1,20}) : (.*)$/), q = el("p");
      if (m) { q.append(el("b", "grp", m[1] + " ")); q.append(m[2]); } else q.append(p);
      b.append(q);
    }
    out.append(b);
  }
  out.append(el("h2", "mine", "Pour moi seulement : les détails"));
  const nums = el("div", "nums");
  const n = (k, v) => { const d = el("div", "num"); d.append(el("div", "k", k), el("div", "v", v)); nums.append(d); };
  n("Sujets", c.sujets); n("Messages", c.messages); n("Présence", dur(c.presence_ms)); n("Agents (cumulé)", dur(c.travail_ms));
  n("Coût éq. API", "$" + Math.round(c.cout_usd));
  if (c.reunions_ms != null) n("Réunions", dur(c.reunions_ms));
  out.append(nums);
  if (!s.sujets.length) out.append(el("p", "empty", "Aucune activité dans la fenêtre."));
  for (const t of s.sujets) {
    const d = el("div", "topic");
    d.append(el("h3", null, t.sujet), el("div", "sub", t.messages ? t.messages + " message" + (t.messages > 1 ? "s" : "") + " · agents " + dur(t.travail_ms) : "agents " + dur(t.travail_ms)));
    if (t.puces.length) { const u = el("ul"); for (const p of t.puces) { const li = el("li"); linked(li, p); u.append(li); } d.append(u); }
    out.append(d);
  }
  if (s.bloque.length) {
    out.append(el("h2", null, "Bloqué / en attente"));
    const b = el("div", "blk"), u = el("ul");
    for (const x of s.bloque) { const li = el("li"); linked(li, x.texte + " "); if (x.sujet) li.append(el("small", null, "· " + x.sujet)); u.append(li); }
    b.append(u);
    out.append(b);
  }
  if (s.autres.length) {
    out.append(el("h2", null, "Autres sujets"));
    out.append(el("p", "rest", s.autres.map(a => a.sujet + (a.messages ? " (" + a.messages + ")" : "")).join(" · ")));
  }
}

async function load(date) {
  clearTimeout(timer);
  let j;
  try {
    j = await (await fetch("/api/daily" + (date ? "?date=" + date : ""))).json();
  } catch (e) {
    $("err").textContent = "Serveur injoignable, nouvel essai…";
    timer = setTimeout(() => load(cur), 5000);
    return;
  }
  cur = j.date; LINEAR = j.linear || {};
  const sel = $("day");
  sel.textContent = "";
  for (const d of j.dates.includes(j.date) || !j.date ? j.dates : [j.date, ...j.dates]) {
    const o = el("option", null, day(d, {weekday: "short", day: "2-digit", month: "2-digit", year: "numeric"}));
    o.value = d; o.selected = d === j.date; sel.append(o);
  }
  $("regen").disabled = j.generating;
  $("regen").textContent = j.generating ? "Génération en cours…" : "Régénérer";
  $("copy").disabled = $("copyn").disabled = !!j.empty;
  render(j);
  if (j.generating) timer = setTimeout(() => load(cur), 3000);
  else if (j.generated_ms) window.__daily = j;
}

$("day").onchange = e => load(e.target.value);
$("regen").onclick = async () => {
  $("regen").disabled = true;
  await fetch("/api/daily/generate", {method: "POST", body: "{}"});
  load(null);
};
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {  // http hors localhost : pas de navigator.clipboard
    const t = el("textarea"); t.value = text; t.style.cssText = "position:fixed;opacity:0";
    document.body.append(t); t.select(); document.execCommand("copy"); t.remove();
  }
}
const flash = (b, label) => { b.textContent = "Copié ✓"; setTimeout(() => b.textContent = label, 1500); };
$("copy").onclick = async () => { await copyText(plain(window.__daily)); flash($("copy"), "Copier le texte à dire"); };
$("copyn").onclick = async () => { await copyText(notes(window.__daily)); flash($("copyn"), "Copier les notes"); };
load(null);
</script>
<script>/* embedded in Miniguet's shell (iframe): in-app links are handled by the shell, which owns the address bar and the music */
if(window.parent!==window){document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');
 if(h==='/'){e.preventDefault();parent.postMessage({mg:'close'},location.origin)}
 else if(/^\/(stats|daily|daily\/history)(\?|$)/.test(h)){e.preventDefault();parent.postMessage({mg:'open',href:h},location.origin)}})}
</script>
</body></html>
